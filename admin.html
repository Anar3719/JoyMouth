<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Mouth Admin - Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2ecc71; --bg: #f4f7f6; --card-bg: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .order-card { background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #edf2f7; transition: 0.3s; position: relative; overflow: hidden; }
        .order-card.new-order::before { content: 'ШИНЭ'; position: absolute; top: 10px; right: -30px; background: #e74c3c; color: white; padding: 5px 40px; transform: rotate(45deg); font-size: 10px; font-weight: 800; }
        .status-badge { padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; }
        .items-list { background: #f8fafc; padding: 15px; border-radius: 15px; margin: 15px 0; }
        .total { font-size: 22px; font-weight: 800; color: var(--primary); text-align: right; }
        select { width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-family: inherit; font-weight: 600; cursor: pointer; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        button.login-btn { padding: 15px 30px; font-size: 16px; font-weight: 800; background: #4285F4; color: white; border: none; border-radius: 12px; cursor: pointer; }
        .notification-bar { background: white; border: 1px solid #dce6df; border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; }
        .notification-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .notification-actions button { background: #edf6ef; color: #174d30; border: 1px solid #c6e2cf; border-radius: 8px; padding: 9px 12px; min-height: 44px; cursor: pointer; font: inherit; font-weight: 600; }
        .notification-status:not(:empty) { margin: 10px 0 0; }
        #new-order-signal:not(:empty) { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: #e5f8eb; color: #174d30; font-weight: 800; }
        .order-card:target { outline: 2px solid #21754a; outline-offset: -2px; }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2>Joy Mouth Admin</h2>
    <p>Админ эрхээр нэвтэрнэ үү</p>
    <p id="admin-login-notice" role="status"></p>
    <button class="login-btn" onclick="adminLogin()">Google-ээр нэвтрэх</button>
</div>

<audio id="orderSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<div class="header">
    <h1 style="margin: 0; font-weight: 800;">👨‍🍳 Joy Mouth Admin</h1>
    <div id="stats" style="font-weight: 800; color: var(--primary); background: #f0fdf4; padding: 10px 20px; border-radius: 15px;">
        Нийт: <span id="count">0</span>
        <button id="admin-sign-out" type="button" style="margin-left: 10px; border: none; background: none; cursor: pointer; font-size: 12px; color: #666;">Гарах</button>
    </div>
</div>

<section class="notification-bar" aria-label="Захиалгын мэдэгдэл">
    <p id="new-order-signal" role="status"></p>
    <div class="notification-actions">
        <button type="button" id="sound-toggle" aria-pressed="false">Дуу асаах</button>
        <button type="button" id="push-toggle" aria-pressed="false">Утас, компьютерийн мэдэгдэл асаах</button>
    </div>
    <p id="notification-status" class="notification-status" role="status"></p>
</section>
<div class="grid" id="admin-orders"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
<script src="admin-firebase-config.js"></script>
<script src="admin-notifications.js"></script>
<script>
    firebase.initializeApp(adminFirebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const notifications = createAdminNotifications();
    let stopOrders;
    const statusColors = new Map([
        ['Шинэ', '#ad6000'], ['Бэлтгэгдэж байна', '#7951a3'],
        ['Хүргэлтэнд гарсан', '#aa4f18'], ['Хүргэгдсэн', '#218044'],
        ['Цуцлагдсан', '#b64135'], ['Төлбөр хүлээгдэж байна', '#286794'],
    ]);
    document.getElementById('admin-sign-out').addEventListener('click', notifications.signOut);

    // Нэвтрэлтийн төлөв хянах
    auth.onAuthStateChanged(user => {
        stopOrders?.();
        stopOrders = undefined;
        if (user && user.email === "g.anar1202@gmail.com") {
            document.getElementById('admin-login-notice').textContent = '';
            document.getElementById('login-overlay').style.display = 'none';
            stopOrders = startListening();
            notifications.refresh();
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('admin-orders').replaceChildren();
            document.getElementById('count').textContent = '0';
            notifications.clear();
            if (user) {
                Swal.fire("Админ биш", `${user.email} хаяг админ эрхгүй байна.`, "error");
                auth.signOut();
            }
        }
    });

    function adminLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function startListening() {
        let knownServerOrderIds;
        let highlightedOrder;
        const list = document.getElementById('admin-orders');
        return db.collection('orders').orderBy('createdAt', 'desc').onSnapshot({
            includeMetadataChanges: true,
        }, (snapshot) => {
            document.getElementById('count').textContent = snapshot.size;
            if (!snapshot.metadata.fromCache) {
                if (knownServerOrderIds) {
                    const added = snapshot.docs.filter((doc) => !knownServerOrderIds.has(doc.id));
                    if (added.length) notifications.signal(added.length);
                }
                knownServerOrderIds = new Set(snapshot.docs.map((doc) => doc.id));
            }
            if (list.childElementCount !== snapshot.size || snapshot.docChanges().length) {
                list.replaceChildren(...snapshot.docs.map(renderOrder));
            }
            const orderId = location.hash.slice(1);
            const target = orderId && document.getElementById(orderId);
            if (target && highlightedOrder !== orderId) {
                target.scrollIntoView({ block: 'center' });
                highlightedOrder = orderId;
            }
        }, (error) => {
            console.error('Firestore order listener:', error.code);
            if (error.code === 'permission-denied') {
                Swal.fire('Захиалгыг унших эрхгүй байна', 'Админ эрхээ шалгана уу.', 'warning');
            }
        });
    }

    function node(tag, text, className) {
        const item = document.createElement(tag);
        item.textContent = text ?? '';
        if (className) item.className = className;
        return item;
    }

    function renderOrder(doc) {
        const data = doc.data();
        const card = node('article', '', data.status === 'Шинэ' ? 'order-card new-order' : 'order-card');
        card.id = 'order-' + encodeURIComponent(doc.id);
        const heading = node('div');
        heading.style.cssText = 'display:flex; justify-content:space-between; align-items:start; gap:12px';
        const user = node('div');
        const name = node('strong', data.userName);
        const time = node('div', data.createdAt?.toDate().toLocaleTimeString() || 'Саяхан');
        time.style.cssText = 'font-size:12px; color:#64748b';
        user.append(name, time);
        const status = node('span', data.status, 'status-badge');
        status.style.background = statusColors.get(data.status) || '#5f6b65';
        status.style.color = 'white';
        heading.append(user, status);

        const contact = node('div');
        contact.style.cssText = 'margin:15px 0; font-size:13px';
        contact.append(node('div', '📍 ' + (data.address || '')), node('div', '📞 ' + (data.userPhone || '')));
        const items = node('div', '', 'items-list');
        for (const [name, quantity] of Object.entries(data.items || {})) {
            const item = node('div');
            item.style.cssText = 'display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px';
            item.append(node('span', name), node('b', 'x' + quantity));
            items.append(item);
        }
        const total = node('div', (data.totalPrice || 0).toLocaleString() + '₮', 'total');
        const select = node('select');
        select.setAttribute('aria-label', 'Захиалгын төлөв');
        for (const label of statusColors.keys()) {
            const option = node('option', label);
            option.value = label;
            option.selected = label === data.status;
            select.append(option);
        }
        select.addEventListener('change', () => updateStatus(doc.id, select.value));
        card.append(heading, contact, items, total, select);
        return card;
    }

    function updateStatus(id, s) {
        db.collection("orders").doc(id).update({ status: s })
            .then(() => Swal.fire({ title: 'Төлөв шинэчлэгдлээ', icon: 'success', timer: 1000, showConfirmButton: false, toast: true, position: 'top-end' }));
    }
</script>
</body>
</html>
