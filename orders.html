<!doctype html>
<html lang="mn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5ef">
    <meta name="description" content="Joy Mouth-ийн сүүлийн захиалгууд болон төлөвөө хараарай.">
    <title>Joy Mouth | Захиалгууд</title>
    <link rel="icon" href="headlogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script defer src="script.js"></script>
</head>
<body class="orders-page">
    <a class="skip-link" href="#order-history">Захиалгууд руу алгасах</a>
    <header class="site-header">
        <div class="wrap header-inner">
            <a href="./" class="brand">
                <img src="headlogo.png" alt="" width="42" height="42">
                <span>Joy Mouth</span>
            </a>
            <nav aria-label="Үндсэн цэс">
                <a class="current-nav" href="orders.html" aria-current="page">Захиалгууд</a>
                <span id="user-name" class="user-name" hidden></span>
                <button class="button button-outline" id="sign-out" type="button" hidden>Гарах</button>
            </nav>
        </div>
    </header>

    <main class="wrap orders-main">
        <a class="back-link" href="./"><span aria-hidden="true">←</span> Цэс рүү буцах</a>
        <section id="order-history" aria-labelledby="history-title">
            <h1 id="history-title">Сүүлийн захиалгууд</h1>
            <p id="history-message" class="empty" role="status">Ачаалж байна…</p>
            <button class="button button-primary history-sign-in" id="sign-in" type="button" hidden>Google-ээр нэвтрэх</button>
            <p id="auth-message" class="message" role="status"></p>
            <div id="history-table" class="history-panel" hidden>
                <table aria-labelledby="history-title">
                    <colgroup>
                        <col class="history-date-col">
                        <col class="history-amount-col">
                        <col class="history-status-col">
                        <col class="history-action-col">
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col">Огноо</th>
                            <th scope="col" class="history-amount">Нийт дүн</th>
                            <th scope="col">Төлөв</th>
                            <th scope="col"><span class="sr-only">Дэлгэрэнгүй</span></th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="site-footer"><div class="wrap">Joy Mouth · Өглөөний цайны захиалга</div></footer>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
        <div class="dialog-heading">
            <h2 id="dialog-title"></h2>
            <form method="dialog"><button class="button button-outline dialog-close" type="submit" aria-label="Хаах">×</button></form>
        </div>
        <div id="dialog-body"></div>
    </dialog>
</body>
</html>
